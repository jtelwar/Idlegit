name: tests

# Runs the full test suite + ruff lint on every pull request, and on
# demand from release.yml via `workflow_call` so a release tag can't
# be cut from a failing tree. Direct pushes to master aren't gated by
# CI — review-then-merge happens through PRs.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff

      - name: Ruff
        run: ruff check core/ ui/ tests/

      - name: Unit + integration tests
        run: python -m unittest discover -s tests -v
