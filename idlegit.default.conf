# idlegit global defaults. Restart idlegit to pick up changes.
# Workspaces (folders to scan) live in idlegit.workspaces — each
# workspace can override any of these defaults per-section.

[idlegit]
suggest_added      = 3       ; max "added" files in a Tab-suggested commit message; 0 hides the category
suggest_updated    = 3       ; max "updated" files in a Tab-suggested commit message; 0 hides the category
suggest_deleted    = 3       ; max "deleted" files in a Tab-suggested commit message; 0 hides the category
lfs_warn_mb        = 100     ; review screen flags files ≥ this size (MB) if not LFS-tracked; 0 disables the check
default_auto_stage = true    ; initial state of the auto-stage toggle on launch (Space flips at runtime)
default_auto_push  = true    ; initial state of the auto-push toggle on launch (Space flips at runtime)
name_display_max     = 30      ; main-screen repo name max width incl. ellipsis; <=0 disables truncation
child_name_display_max = 20    ; submodule + subtree row name max width incl. ellipsis; -1 = inherit name_display_max; 0 disables truncation
branch_display_max   = 12      ; main-screen branch name max width incl. ellipsis; <=0 disables truncation
task_name_display_max = 12     ; sidebar repo-name max width when embedded in a task label (e.g. "align Foo: …"); narrower than the main panel because the sidebar is tight
name_truncation      = middle  ; how main-screen repo names are shortened: start, middle, or end (unknown values fall back to middle)
branch_truncation    = middle  ; how branch names are shortened: start, middle, or end (unknown values fall back to middle)
task_name_truncation = middle  ; how sidebar repo names are shortened: start, middle, or end (unknown values fall back to middle)
max_visible_repo_rows = 0    ; cap on visible repo rows before scrolling kicks in; 0 = use whatever fits in the terminal
tasks_min_width_percent = 0.2 ; task panel minimum share of remaining width after repo/branch/state columns
tasks_max_width_percent = 0.5 ; task panel maximum share of remaining width after repo/branch/state columns
max_commit_message_length_in_review = 480 ; review-screen commit message wraps to fit; only end-truncated once it exceeds this many chars. 0 disables the cap
default_align_heads = true    ; smart-sync: align child heads with parent when offered
default_auto_ff = true        ; smart-sync: fast-forward when safe
default_prompt_for_branch = true ; smart-sync: prompt for a branch name when the workflow needs one
default_prevent_smart_sync_silent_merge = false ; smart-sync: when true, loser alignment uses FF-only merges (no automatic merge commits)

; --- GitHub Actions tracking ---
; Requires the `gh` CLI on PATH and `gh auth login` against github.com. Repos
; whose origin URL isn't a github.com slug are silently ignored.
track_actions_default = true ; tick workflow tracking by default on the review screen (per-row Space to toggle)
actions_poll_seconds  = 5    ; seconds between `gh run view` polls while a workflow run is in flight; clamped to >= 0.5
auto_remove_completed_tasks_after_interval = -1   ; sidebar auto-prune completed tasks timer (seconds). <0 = never (manual Ctrl+R only)

; --- Filesystem-watched auto-refresh ---
; Listen for OS-level fs events under each repo (working tree + .git/)
; and run a lightweight per-repo refresh after `auto_refresh_debounce_ms`
; of quiet, so the displayed state stays in sync with disk without the
; user hitting Ctrl+R. Commit/stage actions always re-read disk at fire
; time, so a refresh between "user sees dirty" and "user hits Enter"
; downgrades to a sidebar warn rather than a phantom commit.
auto_refresh_on_fs_change = true   ; off returns to "Ctrl+R only" behaviour
auto_refresh_debounce_ms  = 400    ; clamped to >= 50; coalesces editor-save bursts

; --- Manual refresh (Ctrl+R) behaviour ---
; When true, Ctrl+R runs `git fetch --all` per repo BEFORE re-reading
; local state, so the displayed ahead/behind reflects actual upstream
; rather than the last fetch. Off by default — Ctrl+R has historically
; been instant + offline; this adds ~200ms/repo against a fast remote,
; more on a flaky network. The fetch only updates remote-tracking refs;
; working trees are never modified by Ctrl+R itself.
fetch_on_manual_refresh = false

; --- Task logging (optional) ---
; When enabled, every task that lands in a terminal status (ok/fail/warn)
; appends one line to `task_log_path`. View / open / clear from the app
; menu (Tab on the title row → TASK LOGGING section).
task_log_enabled    = false   ; off by default; flip on to start writing the log file
task_log_path       =         ; empty = <user data dir>/tasks.log; absolute or ~/-prefixed paths honoured
task_log_max_lines  = 10000   ; cap on log file line count; oldest lines drop first when exceeded. <=0 = unlimited
