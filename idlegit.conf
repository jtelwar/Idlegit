# idlegit configuration. All keys are optional; defaults shown.
# Restart idlegit to pick up changes.

[idlegit]
root               = ..      ; workspace folder to scan, relative to this file (~ expanded; absolute paths fine)
suggest_added      = 3       ; max "added" files in a Tab-suggested commit message; 0 hides the category
suggest_updated    = 3       ; max "updated" files in a Tab-suggested commit message; 0 hides the category
suggest_deleted    = 3       ; max "deleted" files in a Tab-suggested commit message; 0 hides the category
lfs_warn_mb        = 100     ; review screen flags files ≥ this size (MB) if not LFS-tracked; 0 disables the check
default_auto_stage = true    ; initial state of the auto-stage toggle on launch (Space flips at runtime)
default_auto_push  = true    ; initial state of the auto-push toggle on launch (Space flips at runtime)
name_display_max   = 40      ; main-screen repo name max width incl. ellipsis; <=0 disables truncation
branch_display_max = 12      ; main-screen branch name max width incl. ellipsis; <=0 disables truncation
name_truncation    = middle  ; how repo names are shortened: start, middle, or end (unknown values fall back to middle)
branch_truncation  = middle  ; how branch names are shortened: start, middle, or end (unknown values fall back to middle)

; Subtrees — declare each one explicitly. Subtree relationships aren't tracked
; by git itself (no .gitmodules equivalent), so idlegit can't auto-detect them.
; Each section is [subtree.<unique-name>], with `parent` and `source` referring
; to tracked repo folder names ("." for the workspace root) and `prefix` being
; the path within the parent.
;
; Example:
;
; [subtree.shared-libs]
; parent = Upskill.Health.API
; source = Upskill.Health.Domain.Models
; prefix = libs/shared
