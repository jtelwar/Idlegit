# Used by `pipx install .` and `pip install -e .` — primarily the
# install path on Windows (where the bash launcher at the repo root
# doesn't apply). Unix users keep using `./install` and `./idlegit`;
# this file is additive and doesn't replace that flow.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "idlegit"
description = "TUI for managing git repo workspaces"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Joel Elwar", email = "joel@elwar.co.uk" }]
keywords = ["git", "tui", "terminal", "workspace", "submodule", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "wcwidth>=0.2",
    "watchdog>=3",
    "pathspec>=0.12",
]
# Version is read from the project-root VERSION file (single source of
# truth — see `core.config._read_version`). `dynamic.attr` imports
# `core.config` at build time and reads the `VERSION` module attribute.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jtelwar/idlegit"
Repository = "https://github.com/jtelwar/idlegit"
Issues = "https://github.com/jtelwar/idlegit/issues"
Changelog = "https://github.com/jtelwar/idlegit/blob/master/VERSION"

[project.optional-dependencies]
# `pipx install ".[windows]"` pulls windows-curses on Windows; the
# marker makes it a no-op on macOS/Linux so the same extra is safe to
# specify cross-platform.
windows = ["windows-curses ; sys_platform == 'win32'"]

[project.scripts]
idlegit = "idlegit:main"
# pipx generates an `idlegit-update.exe` shim on Windows from this
# entry so the in-app "Check for updates → Update now" gesture and
# the bare `idlegit-update` command both work. Unix users installing
# via pipx get a matching shim; the `./install` flow keeps using the
# bash launcher at `scripts/idlegit-update`.
idlegit-update = "scripts.update:main"

[tool.setuptools.dynamic]
version = { attr = "core.config.VERSION" }

[tool.setuptools]
py-modules = ["idlegit"]

[tool.setuptools.packages.find]
include = ["core*", "ui*", "scripts*"]
exclude = ["tests*", "agents*"]

# Ruff configuration — pinned to keep CI deterministic across ruff
# releases. The default rule set (E4/E7/E9 + F) is what the project
# has been linted against; `B` (bugbear) catches the `except Exception`
# pattern the codebase already annotates with `noqa: BLE001` and a few
# other common bug-shaped patterns. Line length is generous (100)
# rather than the 88-char default — the codebase has a handful of
# long task labels / log lines that read better unwrapped.
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["__pycache__", "AGENTS"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# B008: function call in default arg — too noisy with `field(default_factory=...)`.
# B904: `raise X from Y` — codebase uses bare re-raises in places where
# the chained context would just add noise to the user-facing error.
ignore = ["B008", "B904"]
